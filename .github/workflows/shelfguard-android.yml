name: ShelfGuard Android build

on:
  push:
    paths:
      - "shelfguard-android/**"
      - ".github/workflows/shelfguard-android.yml"
  pull_request:
    paths:
      - "shelfguard-android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shelfguard-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shelfguard-debug-apk
          path: shelfguard-android/app/build/outputs/apk/debug/*.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shelfguard-lint-report
          path: shelfguard-android/app/build/reports/lint-results-debug.html
