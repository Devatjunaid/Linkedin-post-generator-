name: Gigometer Android build

on:
  push:
    paths:
      - "gigometer/**"
      - ".github/workflows/gigometer-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gigometer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and release bundle
        run: ./gradlew --no-daemon assembleDebug bundleRelease lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gigometer-debug-apk
          path: gigometer/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gigometer-release-aab-unsigned
          path: gigometer/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gigometer-lint-report
          path: gigometer/app/build/reports/lint-results-debug.html
