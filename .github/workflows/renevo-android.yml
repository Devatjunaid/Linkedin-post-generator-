name: Renevo Android

on:
  push:
    paths:
      - "renevo-android/**"
      - ".github/workflows/renevo-android.yml"
  pull_request:
    paths:
      - "renevo-android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renevo-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK (test ads)
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release bundle (unsigned)
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: renevo-debug-apk
          path: renevo-android/app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renevo-test-reports
          path: renevo-android/app/build/reports
