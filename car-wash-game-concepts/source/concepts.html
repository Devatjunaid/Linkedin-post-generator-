<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Lilita;src:url(fonts/lilita.woff2)}
@font-face{font-family:Fredoka;src:url(fonts/fredoka.woff2);font-weight:300 700}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;font-family:Fredoka,sans-serif;font-weight:600}
.screen{position:relative;width:540px;height:960px;overflow:hidden;margin:20px}
.abs{position:absolute}
.out{font-family:Lilita;color:#fff;letter-spacing:1px;
 text-shadow:3px 0 0 var(--o),-3px 0 0 var(--o),0 3px 0 var(--o),0 -3px 0 var(--o),2px 2px 0 var(--o),-2px 2px 0 var(--o),2px -2px 0 var(--o),-2px -2px 0 var(--o),0 7px 0 var(--o),0 10px 12px rgba(0,0,0,.35)}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,.25) 18%,rgba(180,230,255,.12) 55%,rgba(255,255,255,.55) 72%,rgba(255,255,255,.08) 76%);box-shadow:inset 0 0 6px rgba(255,255,255,.6)}
.pill{position:absolute;height:44px;border-radius:22px;background:rgba(0,30,90,.45);border:3px solid rgba(255,255,255,.5);display:flex;align-items:center;padding:0 16px 0 46px;color:#fff;font-family:Lilita;font-size:24px}
.pill svg{position:absolute;left:-6px;top:-6px;width:50px;height:50px}
.rbtn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;border:4px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.btn{position:absolute;border-radius:28px;display:flex;align-items:center;justify-content:center;font-family:Lilita;color:#fff;border:4px solid #fff}
.tray{position:absolute;left:14px;right:14px;bottom:18px;height:150px;border-radius:34px;background:linear-gradient(#ffffff,#dfe9ff);box-shadow:0 10px 0 #9fb4e6,0 18px 30px rgba(0,0,0,.35);display:flex;justify-content:space-around;align-items:center;padding:0 8px}
.tool{width:84px;height:84px;border-radius:26px;background:linear-gradient(#f3f7ff,#cad8f7);box-shadow:0 6px 0 #9aaedc;display:flex;align-items:center;justify-content:center;position:relative}
.tool svg{width:60px;height:60px}
.tool.on{transform:translateY(-22px) scale(1.15);background:linear-gradient(#ffe36b,#ffb000);box-shadow:0 6px 0 #c77800,0 0 0 6px rgba(255,255,255,.9),0 0 30px 10px rgba(255,214,0,.8)}
.tool .lbl{position:absolute;bottom:-34px;font-size:15px;color:#3554a8;white-space:nowrap;font-family:Lilita;letter-spacing:.5px}
.tool.on .lbl{bottom:-38px;color:#c25b00;font-size:15px}
.tool .lk{position:absolute;inset:0;border-radius:26px;background:rgba(40,50,90,.55);display:flex;align-items:center;justify-content:center}
.bar{position:absolute;height:34px;border-radius:17px;background:rgba(0,20,60,.5);border:4px solid #fff;overflow:visible}
.bar .fill{position:absolute;left:3px;top:3px;bottom:3px;border-radius:12px}
.bar .st{position:absolute;top:-14px;width:44px;height:44px}
.board{width:1920px;height:1080px;position:relative;overflow:hidden;margin:20px;background:#0e1430;color:#fff}
.card{position:absolute;border-radius:28px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);padding:22px}
.card h3{font-family:Lilita;font-size:30px;letter-spacing:1px;margin-bottom:12px}
</style></head><body>

<script>
let uid=0;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(h,a){let n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.round(a>0?v+(255-v)*a:v*(1+a));return'#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
const star4=(x,y,s,c='#fff',o=1)=>`<path d="M${x} ${y-s}Q${x} ${y} ${x+s} ${y}Q${x} ${y} ${x} ${y+s}Q${x} ${y} ${x-s} ${y}Q${x} ${y} ${x} ${y-s}Z" fill="${c}" opacity="${o}"/>`;
function star5(cx,cy,R,r){let p=[];for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(' ')}
const BODY="M30,130 Q26,100 62,95 L112,90 Q142,46 192,42 L262,42 Q302,44 332,88 L360,95 Q388,101 384,130 Q384,149 364,150 L42,150 Q28,149 30,130 Z";
function car(o){
 const c=o.color||'#ff3b6b',id='c'+(uid++),big=o.big,lift=big?34:0,wr=big?44:30,wy=180-wr;
 const L=shade(c,.45),D=shade(c,-.4),R=rng(o.seed||7);
 let mud='';
 if(o.mud){for(let i=0;i<80;i++){const x=20+R()*370,y=40+R()*115,r=6+R()*22;mud+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${R()>.5?'#6b4220':'#82552a'}" opacity="${.75+R()*.25}"/>`;if(R()>.6)mud+=`<path d="M${x-3} ${y} q3 ${18+R()*20} 6 0z" fill="#5a3518"/>`}
  for(let i=0;i<12;i++){mud+=`<ellipse cx="${30+R()*350}" cy="${48+R()*100}" rx="${4+R()*8}" ry="${2+R()*4}" fill="#a87a45" opacity=".7"/>`}}

 if(o.foamX){for(let i=0;i<34;i++){const x=o.foamX-20+R()*40,y=36+R()*120,r=6+R()*14;foam+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#bfe6ff" stroke-width="2"/><circle cx="${x-r*.35}" cy="${y-r*.35}" r="${r*.25}" fill="#e8f7ff"/>`}}
 const wheel=cx=>{let s=`<circle cx="${cx}" cy="${wy}" r="${wr}" fill="#23232e" stroke="#0e0e16" stroke-width="4"/>`;
  if(big)for(let k=0;k<12;k++){const a=k*Math.PI/6;s+=`<rect x="${cx-5}" y="${wy-wr-3}" width="10" height="10" rx="2" fill="#23232e" transform="rotate(${k*30} ${cx} ${wy})"/>`}
  s+=`<circle cx="${cx}" cy="${wy}" r="${wr*.56}" fill="url(#rim${id})" stroke="#7d8796" stroke-width="2"/>`;
  for(let k=0;k<5;k++)s+=`<rect x="${cx-3}" y="${wy-wr*.52}" width="6" height="${wr*.4}" rx="3" fill="#8a96a8" transform="rotate(${k*72+15} ${cx} ${wy})"/>`;
  s+=`<circle cx="${cx}" cy="${wy}" r="${wr*.14}" fill="${c}" stroke="#fff" stroke-width="2"/>`;
  if(o.tire)s+=`<path d="M${cx-wr*.8} ${wy-wr*.3} A${wr*.85} ${wr*.85} 0 0 1 ${cx+wr*.2} ${wy-wr*.82}" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/>`+star4(cx-wr*.55,wy-wr*.7,10);
  if(o.mud&&!o.cleanWheels)s+=`<circle cx="${cx-8}" cy="${wy+6}" r="${wr*.45}" fill="#6b4220" opacity=".8"/>`;

 const ref=o.reflect;

  <path d="M248,84 L264,58 L274,58 L258,84Z" fill="#fff" opacity=".45"/>
  <path d="M229,92 L229,146" stroke="${D}" stroke-width="3" opacity=".6"/>
  <path d="M120,92 L120,140" stroke="${D}" stroke-width="3" opacity=".35"/>
  <rect x="240" y="100" width="22" height="6" rx="3" fill="${D}"/><rect x="134" y="100" width="22" height="6" rx="3" fill="${D}"/>

  ${o.shine?`<path d="M200,44 Q250,44 290,62 L284,66 Q248,50 200,50Z" fill="#fff" opacity=".8"/>`:''}

  <ellipse cx="38" cy="110" rx="7" ry="9" fill="#ff4d5e" stroke="${D}" stroke-width="3"/>
  <path d="M352,96 L366,82 L370,86 L358,98Z" fill="${D}"/>
  ${o.mud?`<g clip-path="url(#b${id})"><g clip-path="url(#m${id})">${mud}</g></g>`:''}
  ${foam}
 </g>
 ${wheel(105)}${wheel(300)}
 ${o.shine?star4(330,70,18)+star4(92,96,13)+star4(250,36,11)+star4(372,108,10,'#fffbd0')+star4(180,118,9):''}`;
 return `<svg viewBox="-10 -40 420 240" width="${o.w||400}" style="${o.style||''}" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${L}"/><stop offset=".42" stop-color="${c}"/><stop offset="1" stop-color="${D}"/></linearGradient>
  <linearGradient id="w${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9f6ff"/><stop offset="1" stop-color="#3b7fc9"/></linearGradient>
  <radialGradient id="rim${id}" cx=".35" cy=".35"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa6b8"/></radialGradient>
  <clipPath id="b${id}"><path d="${BODY}"/></clipPath>
  <clipPath id="m${id}"><rect x="-20" y="-20" width="${o.mudX||440}" height="260"/></clipPath>
 </defs>${inner}</svg>`;
}

const I={
