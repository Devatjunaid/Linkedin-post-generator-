<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>4 AI Agents — renderer</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Deterministic motion-graphics renderer. window.renderFrame(t) draws the frame at time t (seconds).
// The canvas works in a 1920x1080 coordinate space and is backed by SCALE x that many pixels (2 => 4K).
const W = 1920, H = 1080;
const SCALE = Number(new URLSearchParams(location.search).get('scale') || 2);
const cv = document.getElementById('c');
cv.width = W * SCALE; cv.height = H * SCALE;
const ctx = cv.getContext('2d');

const C = {
  bg0: '#04060c', bg1: '#0a1124', cyan: '#22d3ee', blue: '#3b82f6', violet: '#8b5cf6', pink: '#ec4899',
  green: '#22c55e', lime: '#a3e635', red: '#ef4444', amber: '#f59e0b', white: '#f8fafc', dim: '#94a3b8',
  glass: 'rgba(148,163,255,0.07)', glassEdge: 'rgba(186,200,255,0.22)',
};
const FONT = 'Inter, "Inter Display", "DejaVu Sans", sans-serif';
const MONO = '"DejaVu Sans Mono", "Liberation Mono", monospace';

// ------------------------------------------------------------------ math & easing
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3);
const eio = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eob = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const eexp = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
// fade in over [a, a+fi], out over [b-fo, b]
const win = (t, a, b, fi = 0.4, fo = 0.4) => Math.min(prog(t, a, a + fi), 1 - prog(t, b - fo, b));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }

// ------------------------------------------------------------------ drawing helpers
function font(size, weight = 600, fam = FONT) { ctx.font = `${weight} ${size}px ${fam}`; }
function text(s, x, y, o = {}) {
  ctx.save();
  font(o.size || 32, o.weight || 600, o.mono ? MONO : FONT);
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'middle';
  ctx.letterSpacing = (o.spacing || 0) + 'px';
  ctx.globalAlpha *= o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glowColor || o.color || C.cyan; ctx.shadowBlur = o.glow; }
  ctx.fillStyle = o.color || C.white;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, size, weight = 600, mono = false, spacing = 0) {
  ctx.save(); font(size, weight, mono ? MONO : FONT); ctx.letterSpacing = spacing + 'px';
  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function typed(s, k) { return s.slice(0, Math.round(s.length * clamp(k))); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function glass(x, y, w, h, o = {}) {
  ctx.save();
  ctx.globalAlpha *= o.alpha ?? 1;
  rr(x, y, w, h, o.r ?? 22);
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, o.top || 'rgba(160,180,255,0.11)'); g.addColorStop(1, o.bottom || 'rgba(120,140,255,0.04)');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = o.edge || C.glassEdge; ctx.stroke();
  // top highlight
  ctx.beginPath(); ctx.moveTo(x + 24, y + 1); ctx.lineTo(x + w - 24, y + 1);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.stroke();
  ctx.restore();
}
function glowDot(x, y, r, color, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexA(color, 1)); g.addColorStop(0.25, hexA(color, 0.55)); g.addColorStop(1, hexA(color, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function line(pts, color, w = 2, glow = 0, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.restore();
}
function bez(p0, p1, p2, k) { const u = 1 - k; return [u * u * p0[0] + 2 * u * k * p1[0] + k * k * p2[0], u * u * p0[1] + 2 * u * k * p1[1] + k * k * p2[1]]; }
function camera(cx, cy, zoom, rot = 0, fn) {
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(rot); ctx.scale(zoom, zoom); ctx.translate(-cx, -cy); fn(); ctx.restore();
}
function shake(t, t0, amt = 14, dur = 0.6) {
  const k = prog(t, t0, t0 + dur); if (k <= 0 || k >= 1) return [0, 0];
  const a = amt * (1 - k) * (1 - k); return [Math.sin(t * 91) * a, Math.cos(t * 77) * a];
}

// ------------------------------------------------------------------ backgrounds
const STARS = (() => { const r = rng(11); return Array.from({ length: 260 }, () => [r() * W, r() * H, r() * 1.6 + 0.3, r()]); })();
const DUST = (() => { const r = rng(5); return Array.from({ length: 70 }, () => [r() * W, r() * H, r() * 2 + 1, r() * 6.28, r() * 0.5 + 0.2]); })();

function background(t, tint = C.blue, o = {}) {
  ctx.fillStyle = C.bg0; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W * 0.5, H * 0.42, 50, W * 0.5, H * 0.5, W * 0.75);
  g.addColorStop(0, hexA(tint, 0.20)); g.addColorStop(0.5, hexA(C.violet, 0.06)); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (o.grid !== false) floorGrid(t, tint, o.gridAlpha ?? 0.35);
  for (const [x, y, s, p] of STARS) { ctx.fillStyle = `rgba(200,220,255,${0.15 + 0.35 * (0.5 + 0.5 * Math.sin(t * 1.3 + p * 20))})`; ctx.fillRect(x, y * 0.62, s, s); }
  for (const [x, y, s, p, sp] of DUST) {
    const yy = (y - t * 18 * sp) % H; const xx = x + Math.sin(t * 0.4 + p) * 30;
    ctx.fillStyle = hexA(tint, 0.25); ctx.beginPath(); ctx.arc(xx, yy < 0 ? yy + H : yy, s, 0, 7); ctx.fill();
  }
}
function floorGrid(t, color, a) {
  ctx.save(); ctx.globalAlpha = a;
  const hy = H * 0.66;
  const g = ctx.createLinearGradient(0, hy, 0, H); g.addColorStop(0, hexA(color, 0)); g.addColorStop(1, hexA(color, 0.9));
  ctx.strokeStyle = g; ctx.lineWidth = 1.2;
  for (let i = -24; i <= 24; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * 40, hy); ctx.lineTo(W / 2 + i * 260, H); ctx.stroke(); }
  const off = (t * 0.35) % 1;
  for (let i = 0; i < 14; i++) { const k = Math.pow((i + off) / 14, 2.2); const y = hy + k * (H - hy); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
}
function vignette(a = 0.65) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ------------------------------------------------------------------ shared UI pieces
function agentCard(t, t0, num, name, color) {
  // big lower-third reveal, then a persistent corner badge
  const k = prog(t, t0, t0 + 0.6), out = prog(t, t0 + 3.4, t0 + 4.2);
  const big = eo(k) * (1 - eio(out));
  if (big > 0.001) {
    ctx.save(); ctx.globalAlpha = big;
    const x = 120, y = 820;
    ctx.fillStyle = color; ctx.fillRect(x, y - 70, 8 * eo(k), 150);
    text(`AGENT 0${num}`, x + 34, y - 40, { size: 30, weight: 700, color, spacing: 8, glow: 18 });
    text(typed(name, prog(t, t0 + 0.3, t0 + 1.2)), x + 30, y + 22, { size: 74, weight: 800, spacing: -1 });
    ctx.restore();
  }
  const b = eo(prog(t, t0 + 3.8, t0 + 4.4));
  if (b > 0) {
    ctx.save(); ctx.globalAlpha = b;
    const w = measure(name, 22, 700, false, 2) + 150;
    glass(48, 40 - 20 * (1 - b), w, 58, { r: 29 });
    glowDot(82, 69 - 20 * (1 - b), 26, color, 0.8);
    text(`0${num}`, 82, 70 - 20 * (1 - b), { size: 18, weight: 800, align: 'center' });
    text(name, 118, 70 - 20 * (1 - b), { size: 22, weight: 700, spacing: 2, color: C.white });
    ctx.restore();
  }
}
function chip(label, x, y, color, a = 1, size = 22) {
  const w = measure(label, size, 600) + 44;
  ctx.save(); ctx.globalAlpha *= a;
  rr(x - w / 2, y - size, w, size * 2, size); ctx.fillStyle = hexA(color, 0.14); ctx.fill();
  ctx.strokeStyle = hexA(color, 0.6); ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
  text(label, x, y + 1, { size, weight: 600, align: 'center', color: C.white, alpha: a });
}
function check(x, y, s, color, k = 1) {
  if (k <= 0) return;
  const pts = [[x - s * 0.5, y], [x - s * 0.15, y + s * 0.35], [x + s * 0.5, y - s * 0.4]];
  const L1 = clamp(k * 2), L2 = clamp(k * 2 - 1);
  const p = [pts[0], [lerp(pts[0][0], pts[1][0], L1), lerp(pts[0][1], pts[1][1], L1)]];
  if (L2 > 0) p.push([lerp(pts[1][0], pts[2][0], L2), lerp(pts[1][1], pts[2][1], L2)]);
  line(p, color, s * 0.16, 10);
}
function cursor(x, y, press = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1 - press * 0.15, 1 - press * 0.15);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 44); ctx.lineTo(11, 33); ctx.lineTo(20, 52); ctx.lineTo(28, 48); ctx.lineTo(19, 30); ctx.lineTo(34, 30); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 12; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#111'; ctx.stroke(); ctx.restore();
}

// ================================================================== SCENE 1 — HOOK (0–30)
const CHAT_REPLY = ['Sure! Here are some general tips', 'for starting a business:', '1. Find your passion', '2. Work hard and stay consistent', '3. Use social media'];

function sceneRoom(t) {
  const zoom = lerp(1.0, 1.14, eio(prog(t, 0, 8.4)));
  camera(W / 2 + 40, H / 2 + 10, zoom, 0, () => {
    // room
    ctx.fillStyle = '#03040a'; ctx.fillRect(-200, -200, W + 400, H + 400);
    // window with moonlit blinds
    const wx = 150, wy = 120;
    const wg = ctx.createLinearGradient(wx, wy, wx + 380, wy + 420);
    wg.addColorStop(0, 'rgba(70,100,170,0.22)'); wg.addColorStop(1, 'rgba(20,30,70,0.05)');
    ctx.fillStyle = wg; ctx.fillRect(wx, wy, 380, 420);
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; for (let i = 0; i < 14; i++) ctx.fillRect(wx, wy + 10 + i * 30, 380, 12);
    // screen glow spill
    const glowA = 0.55 + 0.05 * Math.sin(t * 7) + 0.04 * Math.sin(t * 23);
    const sg = ctx.createRadialGradient(830, 520, 30, 830, 560, 900);
    sg.addColorStop(0, `rgba(90,150,255,${0.32 * glowA})`); sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg; ctx.fillRect(-200, -200, W + 400, H + 400);
    // desk
    ctx.beginPath(); ctx.moveTo(-200, 760); ctx.lineTo(W + 200, 740); ctx.lineTo(W + 200, H + 200); ctx.lineTo(-200, H + 200); ctx.closePath();
    const dg = ctx.createLinearGradient(0, 740, 0, H); dg.addColorStop(0, '#141a2b'); dg.addColorStop(1, '#05070d');
    ctx.fillStyle = dg; ctx.fill();
    // mug + desk clock
    ctx.fillStyle = '#0d1220'; rr(330, 650, 90, 110, 12); ctx.fill(); ctx.strokeStyle = 'rgba(120,150,220,0.25)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(425, 700, 26, -1.3, 1.3); ctx.stroke();
    for (let i = 0; i < 3; i++) { const sx = 360 + i * 16, ph = t * 1.4 + i; line([[sx, 640], [sx + Math.sin(ph) * 8, 610], [sx - Math.sin(ph) * 6, 580]], 'rgba(180,200,255,0.10)', 3); }
    rr(1500, 690, 170, 62, 10); ctx.fillStyle = '#070a12'; ctx.fill();
    text(Math.floor(t * 2) % 2 ? '3:47 AM' : '3 47 AM', 1585, 722, { size: 34, weight: 700, mono: true, color: C.red, align: 'center', glow: 14 });
    // laptop
    ctx.fillStyle = '#1b2233'; ctx.beginPath(); ctx.moveTo(470, 745); ctx.lineTo(1190, 745); ctx.lineTo(1240, 790); ctx.lineTo(420, 790); ctx.closePath(); ctx.fill();
    rr(500, 300, 660, 445, 16); ctx.fillStyle = '#0c111c'; ctx.fill();
    rr(518, 318, 624, 410, 8); ctx.fillStyle = '#0f1422'; ctx.fill();
    // chat UI
    ctx.save(); rr(518, 318, 624, 410, 8); ctx.clip();
    ctx.fillStyle = '#121a2c'; ctx.fillRect(518, 318, 624, 44);
    text('AI Chat', 545, 341, { size: 18, weight: 700, color: '#c7d2fe' });
    const q = 'write me a business plan';
    const qk = prog(t, 4.2, 6.2);
    // previous question already answered
    rr(760, 380, 360, 46, 16); ctx.fillStyle = '#2563eb'; ctx.fill();
    text('how do I make money online?', 780, 403, { size: 17, weight: 500 });
    rr(540, 442, 420, 168, 16); ctx.fillStyle = '#1e263a'; ctx.fill();
    CHAT_REPLY.forEach((l, i) => text(typed(l, prog(t, 0.6 + i * 0.45, 1.0 + i * 0.45)), 562, 470 + i * 30, { size: 17, weight: 500, color: '#cbd5e1' }));
    // input box with the next question being typed
    rr(540, 664, 580, 46, 23); ctx.fillStyle = '#0b1120'; ctx.fill(); ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.5; ctx.stroke();
    text(typed(q, qk) + ((t * 2) % 1 < 0.5 ? '|' : ''), 565, 688, { size: 17, weight: 500, color: '#e2e8f0' });
    ctx.restore();
    // person seen over the shoulder, slumped
    const breathe = Math.sin(t * 1.1) * 6, slump = eio(prog(t, 0, 8)) * 18;
    ctx.save(); ctx.translate(0, breathe * 0.5 + slump);
    ctx.fillStyle = '#010205';
    ctx.beginPath(); ctx.moveTo(960, H + 60); ctx.bezierCurveTo(980, 860, 1080, 800, 1240, 790 + breathe); ctx.bezierCurveTo(1420, 790 + breathe, 1560, 860, 1600, H + 60); ctx.closePath(); ctx.fill();
    ctx.fillRect(1190, 700, 90, 120);
    ctx.save(); ctx.translate(1236, 610); ctx.rotate(-0.08 - slump * 0.004);
    ctx.beginPath(); ctx.ellipse(0, 0, 118, 140, 0, 0, Math.PI * 2); ctx.fill();
    // rim light from the screen
    ctx.strokeStyle = 'rgba(110,160,255,0.55)'; ctx.lineWidth = 3; ctx.shadowColor = '#5b8cff'; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.ellipse(0, 0, 118, 140, 0, Math.PI * 0.75, Math.PI * 1.45); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = 'rgba(110,160,255,0.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(1000, 1000); ctx.bezierCurveTo(1010, 880, 1090, 815, 1190, 800); ctx.stroke();
    ctx.restore();
  });
  vignette(0.8);
  glitchTitle(t);
}

function glitchTitle(t) {
  const a = prog(t, 1.45, 1.75) * (1 - prog(t, 7.4, 7.9));
  if (a <= 0) return;
  const spikes = [1.45, 3.4, 5.6];
  let g = 0.08; for (const s of spikes) g = Math.max(g, 1 - prog(t, s, s + (s === 1.45 ? 0.5 : 0.25)));
  const off = document.createElement('canvas'); off.width = 1400 * SCALE; off.height = 240 * SCALE;
  const o = off.getContext('2d'); o.scale(SCALE, SCALE);
  o.font = `900 150px ${FONT}`; o.textAlign = 'center'; o.textBaseline = 'middle'; o.letterSpacing = '4px';
  o.fillStyle = '#fff'; o.fillText('USING AI WRONG?', 700, 125);
  const cx = W / 2, cy = 175, r = rng(Math.floor(t * 24));
  ctx.save(); ctx.globalAlpha = a;
  ctx.globalCompositeOperation = 'lighter';
  const tint = (col, dx) => {
    const c2 = document.createElement('canvas'); c2.width = off.width; c2.height = off.height;
    const x2 = c2.getContext('2d'); x2.drawImage(off, 0, 0); x2.globalCompositeOperation = 'source-in'; x2.fillStyle = col; x2.fillRect(0, 0, c2.width, c2.height);
    ctx.drawImage(c2, cx - 700 + dx, cy - 120, 1400, 240);
  };
  tint('rgba(255,30,60,0.95)', -10 * g - 3); tint('rgba(0,220,255,0.7)', 10 * g + 3);
  ctx.globalCompositeOperation = 'source-over';
  // slices
  const slices = 14;
  for (let i = 0; i < slices; i++) {
    const sy = (240 / slices) * i, dx = (r() - 0.5) * 120 * g * (r() < 0.5 ? 1 : 0);
    ctx.drawImage(off, 0, sy * SCALE, off.width, (240 / slices) * SCALE, cx - 700 + dx, cy - 120 + sy, 1400, 240 / slices);
  }
  ctx.fillStyle = `rgba(255,40,70,${0.25 * g})`; for (let i = 0; i < 6; i++) ctx.fillRect(cx - 700 + r() * 1300, cy - 110 + r() * 220, r() * 260, 4 + r() * 10);
  ctx.restore();
  // red underline bar
  ctx.fillStyle = hexA(C.red, a); ctx.fillRect(W / 2 - 300 * eo(prog(t, 1.6, 2.2)), 262, 600 * eo(prog(t, 1.6, 2.2)), 6);
}

const AGENTS = [
  { name: 'Research', color: C.cyan, ang: -2.4 }, { name: 'Creative', color: C.violet, ang: -0.75 },
  { name: 'Execution', color: C.amber, ang: 0.75 }, { name: 'Optimizer', color: C.green, ang: 2.4 },
];
const LOGS = ['Research → 42 opportunities ranked', 'Creative → script v3 approved', 'Execution → 18 emails sent',
  'Optimizer → thumbnail B +6.4% CTR', 'Execution → webhook /onboard 200', 'Research → trend spike: "AI agents"',
  'Creative → 4K thumbnail rendered', 'Optimizer → RPM up to $14.20', 'Execution → video scheduled 09:00'];

function sceneDashboard(t) {
  background(t, C.blue, { gridAlpha: 0.25 });
  const k = eio(prog(t, 8, 10.6));
  const zoom = lerp(0.18, 1, k), rot = lerp(-0.35, 0, k);
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.transform(1, lerp(0.18, 0, k), lerp(-0.5, 0, k), 1, 0, 0);
  ctx.rotate(rot); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2 + lerp(300, 0, k));
  const lt = t - 8;
  // frame
  glass(60, 50, W - 120, H - 100, { r: 32, top: 'rgba(120,150,255,0.10)', bottom: 'rgba(60,80,200,0.04)' });
  // top bar
  glowDot(112, 104, 22, C.green, 0.7 + 0.3 * Math.sin(t * 4));
  text('AGENT OS', 145, 104, { size: 28, weight: 800, spacing: 4 });
  text('● LIVE', 165 + measure('AGENT OS', 28, 800, false, 4), 104, { size: 20, weight: 700, color: C.green });
  text(`uptime 24/7  ·  ${(1284 + Math.floor(lt * 37)).toLocaleString('en-US')} tasks today`, W - 110, 104, { size: 20, weight: 500, color: C.dim, align: 'right' });
  // sidebar
  glass(90, 150, 260, H - 230, { r: 20 });
  ['Overview', 'Agents', 'Pipelines', 'Revenue', 'Logs'].forEach((s, i) => {
    if (i === 1) { rr(105, 180 + i * 64, 230, 46, 12); ctx.fillStyle = 'rgba(99,102,241,0.25)'; ctx.fill(); }
    text(s, 135, 203 + i * 64, { size: 22, weight: i === 1 ? 700 : 500, color: i === 1 ? C.white : C.dim });
  });
  // network
  const cx = 930, cy = 520, R = 270;
  glass(380, 150, 1100, H - 230, { r: 20 });
  text('MULTI-AGENT NETWORK', 410, 190, { size: 18, weight: 700, color: C.dim, spacing: 4 });
  const nodes = AGENTS.map(a => [cx + Math.cos(a.ang) * R * 1.45, cy + Math.sin(a.ang) * R * 0.95]);
  nodes.forEach((p, i) => {
    const on = prog(lt, 2.2 + i * 0.6, 3.0 + i * 0.6);
    const ctrl = [(p[0] + cx) / 2, (p[1] + cy) / 2 - 80];
    const pts = []; for (let s = 0; s <= 40; s++) pts.push(bez([cx, cy], ctrl, p, s / 40 * on));
    line(pts, AGENTS[i].color, 3, 16, 0.8);
    // light pulses
    for (let j = 0; j < 3; j++) {
      const ph = ((lt * 0.55 + j / 3 + i * 0.13) % 1);
      if (on >= 1) { const q = bez([cx, cy], ctrl, p, ph); glowDot(q[0], q[1], 22, AGENTS[i].color, 0.9); }
    }
    // cross links
    const nxt = nodes[(i + 1) % 4];
    if (on >= 1 && i % 2 === 0) line([p, nxt], hexA(AGENTS[i].color, 0.25), 1.5);
  });
  // core
  glowDot(cx, cy, 150 + 10 * Math.sin(t * 3), C.blue, 0.8);
  ctx.save(); ctx.strokeStyle = hexA(C.cyan, 0.7); ctx.lineWidth = 2;

function gearPath(N, r, depth) {

    const a1 = ((i + 1) / steps) * Math.PI * 2; pts.push([Math.cos(a1 - 0.0001) * rr2, Math.sin(a1 - 0.0001) * rr2]);
  }
  return pts;
}

    g.r = g.N * m / 2; g.depth = m * 0.55;
    if (i === 0) { g.x = 860; g.y = 560; g.ratio = 1; g.phase = 0; return; }

    rr(x, y, w, h, 22); ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = hexA(c, 0.8); ctx.lineWidth = 3; ctx.stroke();
    glowDot(x + w - 130, y + 150, 110, c, 0.6);
    text(title.toUpperCase(), x + 34, y + h - 100, { size: 34, weight: 900, color: C.white });
    text(sub, x + 34, y + h - 50, { size: 24, weight: 600, color: C.dim });
    text('▶ WATCH NEXT', x + 34, y + 50, { size: 20, weight: 800, color: c, spacing: 3 });
    ctx.restore();
  });
  vignette(0.6);
}

// ================================================================== timeline
const SHOTS = [
  [0, 8, sceneRoom], [8, 20, sceneDashboard], [20, 27.6, sceneMontage], [27.6, 30, sceneEcosystem],
  [30, 45, sceneGlobe], [45, 60, sceneDatabase], [60, 75, sceneKinetic],
  [75, 90, sceneSplit], [90, 120, sceneLoop],
  [120, 140, sceneWorkflow], [140, 165, sceneGears],
  [165, 195, sceneRevenue], [195, 225, sceneCompare],
  [225, 250, sceneSolo], [250, 270.1, sceneSubscribe],
];
const SCENE_CUTS = [30, 75, 120, 165, 225];
const SHOT_CUTS = [8, 45, 60, 90, 140, 195, 250];

function transitions(t) {
  // light-streak wipe + flash on agent changes, softer flash on shot changes
  for (const c of SCENE_CUTS) {
    const k = (t - c) / 0.45;
    if (k > -1 && k < 1) {
      const a = 1 - Math.abs(k);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const x = lerp(-300, W + 300, (k + 1) / 2);
      const g = ctx.createLinearGradient(x - 400, 0, x + 400, 0);
      g.addColorStop(0, 'rgba(34,211,238,0)'); g.addColorStop(0.5, `rgba(180,240,255,${0.85 * a})`); g.addColorStop(1, 'rgba(139,92,246,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.restore();
      ctx.fillStyle = `rgba(0,0,0,${0.5 * a * a})`; ctx.fillRect(0, 0, W, H);
    }
  }
  for (const c of SHOT_CUTS) {
    const k = (t - c) / 0.35;
    if (k > -1 && k < 1) { const a = 1 - Math.abs(k); ctx.fillStyle = `rgba(4,6,12,${0.9 * a * a})`; ctx.fillRect(0, 0, W, H); }
  }
}

window.renderFrame = function (t) {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  const shot = SHOTS.find(s => t >= s[0] && t < s[1]) || SHOTS[SHOTS.length - 1];
  ctx.save(); shot[2](t); ctx.restore();
  transitions(t);
  // film grain-ish scanline sheen + global fade in/out
  const fade = Math.min(prog(t, 0, 0.6), 1 - prog(t, 268.6, 270));
  if (fade < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fade})`; ctx.fillRect(0, 0, W, H); }
  return true;
};
window.ready = document.fonts.ready.then(() => { window.renderFrame(0); return true; });
</script>
