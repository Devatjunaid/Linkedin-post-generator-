<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="anim-common.css"><style>
.logo{position:absolute;left:50%;top:620px;width:420px;height:420px;margin-left:-210px}
.corners{transform-origin:54px 54px;animation:corners .8s cubic-bezier(.3,1.6,.5,1) both}
@keyframes corners{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
.heart{transform-origin:54px 55px;animation:pop .6s .35s cubic-bezier(.3,1.7,.5,1) both,beat 1.2s 1.2s ease-in-out infinite}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.13)}24%{transform:scale(1)}36%{transform:scale(1.07)}48%{transform:scale(1)}}
.pulse{stroke-dasharray:80;stroke-dashoffset:80;animation:draw .9s .6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.name{position:absolute;left:0;right:0;top:1090px;text-align:center;font-size:110px;font-weight:800;letter-spacing:-3px;opacity:0;animation:rise .7s 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.tag{position:absolute;left:0;right:0;top:1250px;text-align:center;font-size:44px;font-weight:700;opacity:0;animation:rise .7s 1.5s cubic-bezier(.2,.8,.2,1) forwards}
.pills{position:absolute;left:0;right:0;top:1420px;display:flex;justify-content:center;gap:18px;opacity:0;animation:rise .7s 1.9s cubic-bezier(.2,.8,.2,1) forwards}
.pills span{background:rgba(255,255,255,.16);padding:16px 30px;border-radius:999px;font-weight:700;font-size:34px}
.ecg{position:absolute;left:0;top:1640px;width:1080px;opacity:.22}
.ecg polyline{stroke-dasharray:1300;stroke-dashoffset:1300;animation:draw 1.8s .4s linear forwards}
</style></head><body>
<div class="ring" style="width:600px;height:600px;top:830px"></div><div class="ring" style="width:600px;height:600px;top:830px;animation-delay:1s"></div><div class="ring" style="width:600px;height:600px;top:830px;animation-delay:2s"></div>
