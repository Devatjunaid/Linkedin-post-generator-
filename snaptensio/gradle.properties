org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- AdMob -------------------------------------------------------------------
# Debug builds ALWAYS use Google's official test ads. Release builds read the
# real IDs below. Put your own IDs in ~/.gradle/gradle.properties (not in git),
# or replace these values before publishing. Leaving them empty makes release
# builds fall back to test IDs, which show "Test Ad" and earn nothing.
SNAPTENSIO_ADMOB_APP_ID=
SNAPTENSIO_ADMOB_BANNER_ID=
SNAPTENSIO_ADMOB_INTERSTITIAL_ID=
SNAPTENSIO_ADMOB_NATIVE_ID=
